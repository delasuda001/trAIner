<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sillage, hors ligne</title>
<style>
  :root { --bg: #F1F2EC; --ink: #15151E; --muted: #5d5f66; --card: #ffffff; --line: #15151E; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15151E; --ink: #F1F2EC; --muted: #a9abb3; --card: #1f1f2b; --line: #F1F2EC; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  button { font: inherit; border: 2px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Sillage est hors ligne</h1>
  <p>Le Mac de Bastien, où fonctionne Sillage, est éteint ou sans réseau. Cette page n'a pas encore été gardée sur cet appareil : elle sera disponible hors ligne après une prochaine visite en ligne.</p>
  <p>Les pages déjà consultées restent lisibles : revenez au tableau de bord.</p>
  <button type="button" onclick="location.href='/'">Tableau de bord</button>
  <button type="button" onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
